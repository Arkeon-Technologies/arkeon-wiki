# Skill metadata and per-provider frontmatter.
# Body content lives in body/<skill>.md — this file only defines metadata
# and provider-specific frontmatter fields that get composed at build time.

skills:
  arkeon-wiki-doctor:
    description: "Set up, configure, and diagnose a local arkeon-wiki installation: install, start stack, configure LLM, check health."
    argument-hint: ""
  arkeon-wiki-ingest:
    description: "Add files to the knowledge graph, monitor extraction and drafting, pull and edit wikis. Safe to run repeatedly."
    argument-hint: "[file paths or directories to add]"

providers:
  claude:
    format: skill-dir
    dir: "~/.claude/skills"
    global: true
    frontmatter:
      common:
        disable-model-invocation: true
      per-skill:
        arkeon-wiki-doctor:
          allowed-tools: "Bash(arkeon-wiki *, npx arkeon-wiki *, npm view arkeon-wiki *, curl *, ls *, cat *), Read, Glob, Grep"
        arkeon-wiki-ingest:
          allowed-tools: "Bash(arkeon-wiki *, npx arkeon-wiki *, curl *, ls *), Read, Glob, Grep, Write, Agent"

  codex:
    format: skill-dir
    dir: "~/.codex/skills"
    global: true
    frontmatter:
      common: {}
      per-skill: {}

  cursor:
    format: cursor-commands
    dir: ".cursor/commands"
    global: false
    frontmatter:
      common: {}
      per-skill: {}

  gemini:
    format: skill-dir
    dir: "~/.gemini/skills"
    global: true
    frontmatter:
      common: {}
      per-skill: {}
