name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, fs-first]
    paths:
      - 'packages/arkeon/**'
      - 'packages/explorer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-push.yml'
  pull_request:
    paths:
      - 'packages/arkeon/**'
      - 'packages/explorer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-push.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w packages/arkeon

      - name: Unit tests
        run: npm test -w packages/arkeon

      - name: E2e tests
        run: npm run test:e2e -w packages/arkeon

  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SPDX headers
        run: |
          set -euo pipefail

          mapfile -t files < <(find packages -type f \
            \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/dist/*" \
            -not -path "*/build/*" \
            -not -path "*/generated/*")

          missing=()
          for f in "${files[@]}"; do
            if ! head -4 "$f" | grep -q "SPDX-License-Identifier"; then
              missing+=("$f")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing SPDX license header:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          echo "All ${#files[@]} source files have SPDX headers."
