name: Publish

# Triggered by publishing a GitHub Release. The tag prefix selects the
# package to publish:
#   arkeon-wiki-v<version>  → publishes `arkeon-wiki` (CLI) to npm
#
# Releases via UI: https://github.com/Arkeon-Technologies/arkeon-wiki/releases/new
# Releases via CLI: gh release create arkeon-wiki-v0.1.0 --generate-notes
#
# The package is a trusted publisher of this workflow file on npm (OIDC),
# so no npm token is needed — the job publishes with `--provenance` to
# attach a verifiable supply-chain attestation.

on:
  release:
    types: [published]

jobs:
  publish-cli:
    if: startsWith(github.ref, 'refs/tags/arkeon-wiki-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 (not 22) is required: npm's trusted-publishing OIDC handshake
      # needs npm >= 11.5.1, and Node 22 ships with npm 10.x. With the old
      # npm, the handshake silently fails and the registry treats the
      # publish as anonymous — surfacing as a misleading `404 Not Found` on
      # the PUT. See https://github.com/npm/cli/issues/8730.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#arkeon-wiki-v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build arkeon-wiki
        run: npm run build -w packages/arkeon

      - name: Set package version from tag
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version -w packages/arkeon

      - name: Publish to npm
        run: npm publish -w packages/arkeon --access public --provenance
